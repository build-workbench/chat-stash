<!doctype html>
<html>
  <body>
    <main
      data-chatstash-conversation="synthetic-conv-basic"
      data-chatstash-title="Synthetic basic chat"
      data-chatstash-source-url="https://chatgpt.com/c/synthetic-conv-basic"
    >
      <article class="turn" data-chatstash-turn="user" data-chatstash-message-id="u1">
        <div class="body" data-chatstash-body><p>What is test-driven development?</p></div>
      </article>
      <article
        class="turn"
        data-chatstash-turn="assistant"
        data-chatstash-message-id="a1"
        data-chatstash-state="complete"
      >
        <div class="body" data-chatstash-body>
          <p>
            <strong>TDD</strong> is a software practice where you write a failing test first, then
            make it pass.
          </p>
          <pre><code>test("adds numbers", () =&gt; { expect(add(1, 2)).toBe(3) })</code></pre>
        </div>
      </article>
      <article class="turn" data-chatstash-turn="user" data-chatstash-message-id="u2">
        <div class="body" data-chatstash-body><p>Show an example table.</p></div>
      </article>
      <article
        class="turn"
        data-chatstash-turn="assistant"
        data-chatstash-message-id="a2"
        data-chatstash-state="complete"
      >
        <div class="body" data-chatstash-body>
          <table>
            <thead>
              <tr>
                <th>Language</th>
                <th>Paradigm</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>TypeScript</td>
                <td>Structured</td>
              </tr>
            </tbody>
          </table>
        </div>
      </article>
    </main>
  </body>
</html>
